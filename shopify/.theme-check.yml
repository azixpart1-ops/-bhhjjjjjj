# The product page renders eight files that exist on the store but were never
# committed to this repository — the PDP was refactored into snippets in the
# Shopify admin, and this session had no API access to pull them back. They
# are listed in .store-only, which scripts/lint-shopify.py reads.
#
# theme-check has no way to know that, so it reports eight broken references
# on a page that renders correctly on the store. Silencing the two checks for
# that one file keeps the rest of the report worth reading; leave them on
# everywhere else, because a genuinely missing snippet is exactly the kind of
# fault that takes a section down with no error message.
#
# Delete these two blocks once the store-only files have been pulled in.

MissingTemplate:
  enabled: true
  ignore:
    - sections/pl-pdp-main.liquid

MissingAsset:
  enabled: true
  ignore:
    - sections/pl-pdp-main.liquid
